# Bu dosyayı kopyalayıp application.properties olarak adlandırın
# ve kendi veritabanı bilgilerinizi girin

spring.application.name=randevu

# Server Configuration
server.port=8084

# MySQL Database Configuration
# Kendi veritabanı bilgilerinizi buraya girin
spring.datasource.url=jdbc:mysql://localhost:3306/randevu_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Güvenlik Notları:
# - Gerçek şifrelerinizi asla bu dosyaya yazmayın
# - Bu dosyayı Git'e commit etmeyin
# - Production ortamında environment variables kullanın
