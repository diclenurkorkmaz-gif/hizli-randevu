<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üye Ol - Randevu Sistemi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Sol Taraf - Logo ve Gradient -->
        <div class="left-section">
            <div class="logo-container">
                <div class="logo">
                    <div class="logo-icon">🏥</div>
                </div>
                <div class="logo-text">Randevu Sistemi</div>
                <div class="logo-subtitle">Güvenli ve Hızlı Randevu Alma</div>
            </div>
        </div>

        <!-- Sağ Taraf - Üye Olma Formu -->
        <div class="right-section">
            <div class="login-form-container">
                <div class="login-header" style="color: #e1e5e9">
                    <h2>Üye Ol</h2>
                    <p>Randevu sistemimize katılın</p>
                </div>
                
                <!-- Mesaj Container -->
                <div class="message-container" id="messageContainer" style="display: none;">
                    <div class="message-card">
                        <div class="message-icon" id="messageIcon">
                            <span id="messageIconText">✅</span>
                        </div>
                        <h3 class="message-title" id="messageTitle">Kayıt Başarılı!</h3>
                        <p class="message-text" id="messageText">Giriş sayfasına yönlendiriliyorsunuz...</p>
                    </div>
                </div>
            
                <form class="login-form" id="signupForm">
                    <div class="form-group">
                        <label for="fullName">Ad Soyad:</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Telefon:</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">E-posta:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="tcNo">TC Kimlik No:</label>
                        <input type="text" id="tcNo" name="tcNo" maxlength="11" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="gender">Cinsiyet:</label>
                        <select id="gender" name="gender" required>
                            <option value="">Cinsiyet seçiniz</option>
                            <option value="erkek">Erkek</option>
                            <option value="kadin">Kadın</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="birthDate">Doğum Tarihi:</label>
                        <input type="date" id="birthDate" name="birthDate" max="" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="height">Boy (cm):</label>
                        <input type="number" id="height" name="height" min="100" max="250" placeholder="Boyunuzu girin (cm)">
                    </div>
                    
                    <div class="form-group">
                        <label for="weight">Kilo (kg):</label>
                        <input type="number" id="weight" name="weight" min="30" max="300" step="0.1" placeholder="Kilonuzu girin (kg)">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Şifre:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">Şifre Tekrar:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>
                    
                    <button type="submit" class="login-btn">Üye Ol</button>
                </form>
                
                <div class="login-footer">
                    <p>Zaten üye misiniz? <a href="giris.html">Giriş yapın</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mesaj gösterme fonksiyonu
        function showMessage(type, title, text) {
            const messageContainer = document.getElementById('messageContainer');
            const messageIcon = document.getElementById('messageIconText');
            const messageTitle = document.getElementById('messageTitle');
            const messageText = document.getElementById('messageText');
            
            // Mesaj tipine göre ikon ve stil ayarla
            if (type === 'success') {
                messageIcon.textContent = '✅';
                messageContainer.className = 'message-container success';
            } else if (type === 'error') {
                messageIcon.textContent = '❌';
                messageContainer.className = 'message-container error';
            }
            
            // Mesaj içeriğini ayarla
            messageTitle.textContent = title;
            messageText.textContent = text;
            
            // Mesajı göster
            messageContainer.style.display = 'flex';
            
            // Hata mesajları için 3 saniye sonra otomatik kapat
            if (type === 'error') {
                setTimeout(() => {
                    messageContainer.style.display = 'none';
                }, 3000);
            }
        }
        
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const fullName = formData.get('fullName');
            const phone = formData.get('phone');
            const email = formData.get('email');
            const tcNo = formData.get('tcNo');
            const gender = formData.get('gender');
            const birthDate = formData.get('birthDate');
            const height = formData.get('height');
            const weight = formData.get('weight');
            const password = formData.get('password');
            const confirmPassword = formData.get('confirmPassword');
            
            // Şifre kontrolü
            if (password !== confirmPassword) {
                showMessage('error', 'Şifre Hatası', 'Şifreler eşleşmiyor!');
                return;
            }
            
            // TC Kimlik No kontrolü
            if (tcNo.length !== 11 || !/^\d+$/.test(tcNo)) {
                showMessage('error', 'TC Kimlik No Hatası', 'TC Kimlik No 11 haneli olmalı ve sadece rakam içermelidir!');
                return;
            }
            
            // Telefon kontrolü
            if (phone.length < 10) {
                showMessage('error', 'Telefon Hatası', 'Geçerli bir telefon numarası giriniz!');
                return;
            }
            
            // Cinsiyet kontrolü
            if (!gender) {
                showMessage('error', 'Cinsiyet Hatası', 'Lütfen cinsiyet seçiniz!');
                return;
            }
            
            // Doğum tarihi kontrolü
            if (!birthDate) {
                showMessage('error', 'Doğum Tarihi Hatası', 'Lütfen doğum tarihinizi giriniz!');
                return;
            }
            
            // Doğum tarihi geçmiş olmalı
            const today = new Date();
            const selectedDate = new Date(birthDate);
            if (selectedDate >= today) {
                showMessage('error', 'Doğum Tarihi Hatası', 'Doğum tarihi bugünden önce olmalıdır!');
                return;
            }
            
            // API'ye kayıt isteği gönder
            try {
                const requestData = {
                    fullName: fullName,
                    phone: phone,
                    email: email,
                    tcNo: tcNo,
                    gender: gender,
                    birthDate: birthDate,
                    height: height,
                    weight: weight,
                    password: password
                };
                
                console.log('Kayıt verisi gönderiliyor:', requestData);
                
                const response = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });
                
                const result = await response.json();
                console.log('API yanıtı:', result);
                
                if (result.success) {
                    showMessage('success', 'Kayıt Başarılı!', 'Üyelik işleminiz tamamlandı! Giriş sayfasına yönlendiriliyorsunuz...');
                    setTimeout(() => {
                        window.location.href = 'giris.html';
                    }, 2000);
                } else {
                    showMessage('error', 'Kayıt Hatası', result.message);
                }
            } catch (error) {
                console.error('Kayıt hatası:', error);
                showMessage('error', 'Bağlantı Hatası', 'Kayıt sırasında bir hata oluştu. Lütfen tekrar deneyin.');
            }
        });
        
        // TC Kimlik No sadece rakam girişi
        document.getElementById('tcNo').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
        
        // Telefon numarası formatı
        document.getElementById('phone').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
        
        // Doğum tarihi için maksimum tarih ayarla (bugün)
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const maxDate = today.toISOString().split('T')[0];
            document.getElementById('birthDate').setAttribute('max', maxDate);
        });
    </script>
</body>
</html>
